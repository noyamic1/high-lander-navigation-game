<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navigation Game</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <aside id="hud">
    <h1>Navigation Game</h1>
    <div id="status" data-state="waiting">Waiting for location…</div>
    <div id="error" role="alert" hidden></div>

    <section>
      <h2>Player</h2>
      <div class="coords" id="player-coords">-</div>
      <div class="muted">Accuracy: <span id="accuracy">-</span></div>
    </section>

    <section>
      <h2>Goal</h2>
      <div class="row">
        <span class="coords" id="goal-coords">-</span>
        <button id="copy-goal" disabled>Copy</button>
      </div>
    </section>

    <section>
      <h2>Players</h2>
      <ul id="players"></ul>
    </section>

    <dl>
      <dt>Distance to goal</dt><dd id="distance">-</dd>
      <dt>Route distance</dt><dd id="route">-</dd>
      <dt>Session</dt><dd id="session">-</dd>
    </dl>

    <button id="restart" disabled>New goal</button>
  </aside>

  <div id="banner" hidden>⚽ Goal reached!</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Served automatically by the Socket.IO server, so client and server versions always match. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
